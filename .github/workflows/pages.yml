name: Quality checks and live validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # node açıkça kuruluyor: iki bağlaşım testi app.js'i node ile çalıştırıyor,
      # node yoksa unittest onları atlıyor ve atlanan test "OK" sayılıyor. Koşucu
      # imajı değişirse iki bekçi sessizce susardı.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      # Testler koşuyor VE atlanan test sayısı denetleniyor.
      #
      # Sebebi ölçüldü: Yerelde 134 test geçiyordu, CI'da 133 geçip biri
      # atlanıyordu · fark `lokal/` klasörü. O klasör depoya girmiyor
      # (AGENTS.md §9.a) ve içindeki kaynak Excel'e bağlı olan test CI'da hiç
      # koşmuyor. "CI yeşil" cümlesi bu yüzden "her şey doğrulandı" demek
      # değil ve bu fark HİÇBİR YERDE GÖRÜNMÜYORDU · dışarıdan bir okuyucu
      # iki kez söyledi, iki kez yerelde ölçüp yanlış cevap verdim.
      #
      # Bu adım farkı görünür kılıyor: Atlanan test sayısı beklenenden çoksa
      # derleme duruyor. Yani yeni bir sessiz atlama eklenemiyor.
      - name: testler · atlanan sayısı denetimli
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee /tmp/test.log
          # Beklenen atlama sayısı · her biri GEREKÇELİ olmak zorunda.
          #
          #   1) test_baslik_tablosu_kaynakla_uyusuyor
          #      Ayrıştırıcının okuduğu sütunlar kaynak Excel'de yerinde mi.
          #   2) KaynakKunyesi::test_yerel_dosya_varsa_ozeti_kunyeyle_ayni
          #      Yerel snapshot'ın özeti künyedekiyle aynı mı.
          #
          # İkisi de `lokal/` altındaki kaynak dosyaya bağlı ve o klasör depoya
          # girmiyor (AGENTS.md §9.a). İkisi de kaynak tablo güncellendiğinde
          # ELLE koşturulmalı · README-DEPLOY.md'de komutuyla yazılı.
          #
          # Bu sayı artırılacaksa, artıran kişi yukarıya gerekçesini de yazıyor.
          BEKLENEN=2
          # "... skipped 'sebep'" satırları sayılıyor · özet satırı ("OK
          # (skipped=1)") sayıma girmesin diye kalıp dar tutuldu. İlk hâli
          # onu da saydı ve bir atlamayı iki gösterdi.
          ATLANAN=$(grep -c "\.\.\. skipped" /tmp/test.log || true)
          echo "Atlanan test: $ATLANAN (beklenen: $BEKLENEN)"
          if [ "$ATLANAN" -gt "$BEKLENEN" ]; then
            echo "HATA: Beklenenden çok test atlandı."
            grep "\.\.\. skipped" /tmp/test.log
            echo "Yeni bir atlama eklendiyse gerekçesi buraya ve beklenen sayıya yazılmalı."
            exit 1
          fi
          echo "Atlananlar (CI'da koşmayan denetimler):"
          grep "\.\.\. skipped" /tmp/test.log || echo "  yok"

          # Belgelerde önerilen komut da ayrıca koşuyor.
          #
          # Sebebi: Yukarıdaki çağrı kökten keşif yapıyor, README ve
          # CONTRIBUTING ise `-s tests` öneriyor. İkisi FARKLI kod yolları ·
          # biri geçerken öteki kırılabiliyor ve o kırılma yalnız kullanıcıda
          # görünürdü. Dışarıdan bir okuyucu tam bunu iddia etti; iddia
          # üretilemedi ama iki yolun ayrı ayrı sınanmaması gerçek bir açıktı.
          echo "Belgelerde önerilen komut:"
          python -m unittest discover -s tests

  # GitHub Pages legacy yayın yolu yalnız açıkça etkinleştirildiğinde çalışır.
  # Cloudflare Pages kanonik yayın olduğunda PAGES_ENABLED=false bırakılabilir.
  #
  # Pages kapalıyken `configure-pages` "site bulunamadı" diyip kırılıyordu ve
  # her commit kırmızı görünüyordu. Testler geçtiği hâlde. Sonuç şuydu:
  # Kırmızı normalleşti, yani testler GERÇEKTEN bozulsa kimse fark etmeyecekti.
  # Yanlış alarm en pahalı kusur · boşa çalan bir alarm, gerçek
  # alarmı da sağır ediyor.
  #
  # GitHub Pages legacy yayın yolu yalnız açıkça etkinleştirildiğinde çalışır.
  deploy:
    needs: test
    if: github.event_name != 'pull_request' && vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

  # LIVE_SITE_URL tanımlandığında deploy sonrası gerçek HTTP yanıtlarını kontrol eder.
  # GitHub Pages özel header'ları uygulamıyorsa bu iş bilinçli olarak kırılır ve
  # yayın ortamının bir edge/proxy katmanına ihtiyacı olduğu görünür.
  # LIVE_SITE_URL tanımlandığında, GitHub Pages deploy edilse de edilmese de
  # kanonik canlı adresin gerçek HTTP yanıtlarını kontrol eder.
  live_check:
    needs: test
    if: github.event_name != 'pull_request' && vars.LIVE_SITE_URL != ''
    runs-on: ubuntu-latest
    steps:
      - name: canlı route ve güvenlik header denetimi
        env:
          LIVE_SITE_URL: ${{ vars.LIVE_SITE_URL }}
        run: |
          set -euo pipefail
          base="${LIVE_SITE_URL%/}"
          for path in \
            '/' \
            '/index.html' \
            '/agreements.html?uni=maku' \
            '/agreements.html?uni=marmara' \
            '/agreements.html?uni=esogu' \
            '/guide.html?uni=maku'; do
            echo "--- ${base}${path}"
            headers="$(curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors \
              --max-time 30 -D - -o /dev/null "${base}${path}")"
            printf '%s\n' "$headers" | grep -Eiq '^HTTP/.* 20[0-9]|^HTTP/.* 30[0-9]'
            printf '%s\n' "$headers" | grep -Eiq "^content-security-policy:.*frame-ancestors[[:space:]]+'none'"
            printf '%s\n' "$headers" | grep -Eiq '^x-frame-options:[[:space:]]*DENY'
            printf '%s\n' "$headers" | grep -Eiq '^x-content-type-options:[[:space:]]*nosniff'
            printf '%s\n' "$headers" | grep -Eiq '^referrer-policy:[[:space:]]*strict-origin-when-cross-origin'
            printf '%s\n' "$headers" | grep -Eiq '^permissions-policy:'
            printf '%s\n' "$headers" | grep -Eiq '^strict-transport-security:.*max-age=31536000'
          done
